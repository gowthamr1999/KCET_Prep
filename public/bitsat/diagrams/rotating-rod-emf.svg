<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" role="img" aria-labelledby="title desc">
  <title id="title">Rotating conducting rod</title>
  <desc id="desc">A rod OA rotates in a magnetic field perpendicular to the plane.</desc>
  <rect width="620" height="280" fill="#ffffff"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111111"/></marker></defs>
  <circle cx="170" cy="174" r="9" fill="#111111"/>
  <text x="144" y="205" font-family="Arial, sans-serif" font-size="20" fill="#111111">O</text>
  <line x1="170" y1="174" x2="438" y2="82" stroke="#111111" stroke-width="8" stroke-linecap="round"/>
  <circle cx="438" cy="82" r="8" fill="#111111"/>
  <text x="452" y="78" font-family="Arial, sans-serif" font-size="20" fill="#111111">A</text>
  <text x="292" y="112" font-family="Arial, sans-serif" font-size="20" fill="#111111">L = 0.4 m</text>
  <path d="M214 176 A54 54 0 0 1 254 132" stroke="#111111" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="163" font-family="Arial, sans-serif" font-size="20" fill="#111111">omega</text>
  <g fill="#111111" font-family="Arial, sans-serif" font-size="22">
    <text x="78" y="58">x</text><text x="118" y="58">x</text><text x="158" y="58">x</text><text x="198" y="58">x</text><text x="238" y="58">x</text><text x="278" y="58">x</text><text x="318" y="58">x</text><text x="358" y="58">x</text><text x="398" y="58">x</text><text x="438" y="58">x</text>
    <text x="78" y="238">x</text><text x="118" y="238">x</text><text x="158" y="238">x</text><text x="198" y="238">x</text><text x="238" y="238">x</text><text x="278" y="238">x</text><text x="318" y="238">x</text><text x="358" y="238">x</text><text x="398" y="238">x</text><text x="438" y="238">x</text>
  </g>
  <text x="500" y="150" font-family="Arial, sans-serif" font-size="20" fill="#111111">B into page</text>
</svg>
