<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Wizard school night landscape</title>
  <desc id="desc">A fantasy night background with moon, stars, distant mountains, and castle-like silhouettes.</desc>
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11152a"/>
      <stop offset="45%" stop-color="#1b2140"/>
      <stop offset="100%" stop-color="#2b2d4e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.78" cy="0.2" r="0.23">
      <stop offset="0%" stop-color="#f8f5d8" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#d9ddff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d9ddff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ca0cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8ca0cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4365"/>
      <stop offset="100%" stop-color="#283050"/>
    </linearGradient>
    <linearGradient id="mountMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3152"/>
      <stop offset="100%" stop-color="#1d2441"/>
    </linearGradient>
    <linearGradient id="mountNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2545"/>
      <stop offset="100%" stop-color="#131834"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23253f"/>
      <stop offset="100%" stop-color="#15182e"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#nightSky)"/>
  <rect width="3840" height="2160" fill="url(#moonGlow)"/>

  <!-- stars -->
  <g fill="#f3f2ff" opacity="0.9">
    <circle cx="290" cy="240" r="2.8"/><circle cx="510" cy="180" r="2.2"/><circle cx="760" cy="260" r="2.4"/>
    <circle cx="980" cy="140" r="2.6"/><circle cx="1240" cy="220" r="2.3"/><circle cx="1490" cy="160" r="2.5"/>
    <circle cx="1760" cy="250" r="2.6"/><circle cx="2050" cy="190" r="2.3"/><circle cx="2260" cy="120" r="2.4"/>
    <circle cx="2480" cy="260" r="2.5"/><circle cx="2720" cy="150" r="2.8"/><circle cx="3010" cy="210" r="2.4"/>
    <circle cx="3260" cy="170" r="2.5"/><circle cx="3510" cy="240" r="2.6"/>
  </g>

  <!-- moon -->
  <circle cx="3010" cy="350" r="130" fill="#fef7d6" opacity="0.96"/>
  <circle cx="2960" cy="315" r="18" fill="#e8ddb3" opacity="0.5"/>
  <circle cx="3060" cy="372" r="12" fill="#e8ddb3" opacity="0.4"/>

  <!-- distant mist -->
  <rect x="0" y="800" width="3840" height="420" fill="url(#haze)"/>

  <!-- mountain layers -->
  <path d="M0 1220 C 330 1010, 650 1005, 980 1180 C 1260 1328, 1540 1335, 1820 1180 C 2060 1045, 2320 1010, 2580 1130 C 2840 1250, 3090 1260, 3360 1150 C 3520 1085, 3680 1090, 3840 1180 L3840 2160 L0 2160 Z" fill="url(#mountFar)"/>
  <path d="M0 1450 C 300 1290, 600 1290, 900 1415 C 1180 1532, 1420 1540, 1680 1450 C 1900 1375, 2140 1370, 2380 1450 C 2630 1535, 2860 1540, 3110 1468 C 3360 1395, 3600 1395, 3840 1480 L3840 2160 L0 2160 Z" fill="url(#mountMid)"/>
  <path d="M0 1700 C 310 1560, 590 1560, 870 1660 C 1110 1748, 1350 1760, 1600 1700 C 1830 1645, 2050 1650, 2280 1718 C 2520 1788, 2760 1790, 3000 1730 C 3240 1670, 3550 1668, 3840 1760 L3840 2160 L0 2160 Z" fill="url(#mountNear)"/>

  <!-- wizard school silhouette -->
  <g fill="url(#castle)">
    <rect x="1580" y="1265" width="420" height="380"/>
    <rect x="1520" y="1205" width="70" height="440"/>
    <rect x="1990" y="1185" width="72" height="460"/>
    <rect x="1718" y="1120" width="120" height="525"/>
    <rect x="1860" y="1160" width="96" height="485"/>
    <polygon points="1520,1205 1555,1120 1590,1205"/>
    <polygon points="1718,1120 1778,995 1838,1120"/>
    <polygon points="1860,1160 1908,1050 1956,1160"/>
    <polygon points="1990,1185 2026,1098 2062,1185"/>
  </g>

  <!-- warm window lights -->
  <g fill="#f3d79a" opacity="0.9">
    <rect x="1608" y="1330" width="18" height="26"/>
    <rect x="1640" y="1385" width="18" height="26"/>
    <rect x="1680" y="1338" width="18" height="26"/>
    <rect x="1748" y="1288" width="20" height="30"/>
    <rect x="1786" y="1360" width="20" height="30"/>
    <rect x="1888" y="1310" width="18" height="26"/>
    <rect x="1926" y="1372" width="18" height="26"/>
    <rect x="2010" y="1300" width="16" height="24"/>
  </g>
</svg>
