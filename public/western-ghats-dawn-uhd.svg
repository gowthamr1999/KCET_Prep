<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Western Ghats dawn with dark clouds</title>
  <desc id="desc">A cinematic Western Ghats landscape with monsoon-dark clouds, mountain ridges, and a rising sun.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2633"/>
      <stop offset="32%" stop-color="#2a3443"/>
      <stop offset="58%" stop-color="#3a4658"/>
      <stop offset="100%" stop-color="#55677d"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.51" cy="0.6" r="0.24">
      <stop offset="0%" stop-color="#ffd38d" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#ffb56e" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#ffb56e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6b5"/>
      <stop offset="100%" stop-color="#ffbe72"/>
    </linearGradient>

    <linearGradient id="cloudDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a212c"/>
      <stop offset="60%" stop-color="#232c39"/>
      <stop offset="100%" stop-color="#2c3645"/>
    </linearGradient>

    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4f5f"/>
      <stop offset="100%" stop-color="#2e3d4c"/>
    </linearGradient>

    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e413f"/>
      <stop offset="100%" stop-color="#20322f"/>
    </linearGradient>

    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24352f"/>
      <stop offset="100%" stop-color="#15231f"/>
    </linearGradient>

    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6e3ec" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d6e3ec" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>

  <!-- dark monsoon cloud layers -->
  <g opacity="0.95">
    <path d="M0 320 C 280 240, 520 260, 790 330 C 1010 386, 1260 384, 1490 322 C 1770 244, 2050 238, 2320 298 C 2590 358, 2820 366, 3070 330 C 3330 292, 3580 306, 3840 354 L3840 0 L0 0 Z" fill="url(#cloudDark)"/>
    <path d="M0 500 C 250 430, 520 458, 770 520 C 1060 594, 1320 594, 1590 532 C 1880 465, 2140 460, 2400 528 C 2670 600, 2920 612, 3160 570 C 3390 530, 3620 538, 3840 582 L3840 180 L0 180 Z" fill="#2a3442" opacity="0.85"/>
    <path d="M0 650 C 260 600, 520 620, 760 672 C 1020 728, 1280 742, 1520 708 C 1770 672, 2020 668, 2290 710 C 2570 754, 2830 760, 3080 724 C 3330 690, 3580 700, 3840 750 L3840 470 L0 470 Z" fill="#303b4b" opacity="0.7"/>
  </g>

  <!-- rising sun behind ridge -->
  <ellipse cx="1960" cy="1325" rx="250" ry="250" fill="url(#sunDisc)" opacity="0.92"/>
  <rect width="3840" height="2160" fill="url(#sunGlow)"/>

  <!-- distant western ghats ridges -->
  <path d="M0 1260 C 260 1080, 560 1080, 860 1220 C 1120 1340, 1360 1340, 1610 1210 C 1790 1120, 1990 1090, 2190 1185 C 2390 1282, 2580 1290, 2790 1205 C 3010 1118, 3210 1120, 3420 1230 C 3580 1312, 3710 1320, 3840 1270 L3840 2160 L0 2160 Z" fill="url(#ridgeFar)"/>

  <path d="M0 1440 C 220 1310, 440 1300, 660 1390 C 900 1488, 1110 1500, 1330 1420 C 1510 1355, 1700 1345, 1900 1430 C 2110 1518, 2300 1520, 2510 1440 C 2740 1350, 2960 1358, 3190 1470 C 3390 1568, 3610 1580, 3840 1490 L3840 2160 L0 2160 Z" fill="url(#ridgeMid)"/>

  <path d="M0 1650 C 260 1510, 510 1510, 760 1620 C 980 1718, 1210 1730, 1450 1658 C 1660 1592, 1860 1592, 2070 1670 C 2280 1750, 2480 1758, 2700 1690 C 2920 1622, 3120 1628, 3340 1715 C 3510 1782, 3670 1790, 3840 1738 L3840 2160 L0 2160 Z" fill="url(#ridgeNear)"/>

  <!-- valley mist -->
  <g filter="url(#softBlur)">
    <ellipse cx="1020" cy="1500" rx="640" ry="120" fill="url(#mist)"/>
    <ellipse cx="2250" cy="1540" rx="760" ry="140" fill="url(#mist)"/>
    <ellipse cx="3200" cy="1660" rx="460" ry="90" fill="url(#mist)"/>
  </g>
</svg>
