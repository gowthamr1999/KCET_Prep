  <path d="M0 1200 C 500 1120, 980 1170, 1460 1210 C 1880 1245, 2300 1238, 2720 1208 C 3180 1176, 3500 1186, 3840 1220" stroke="#dbf8fb" stroke-width="8" fill="none" opacity="0.35"/>

  <g opacity="0.38" filter="url(#blurSoft)">
    <path d="M180 980 C 360 840, 650 840, 860 980 C 620 1010, 380 1010, 180 980 Z" fill="#3a8594"/>
    <path d="M1080 1015 C 1270 875, 1570 875, 1800 1015 C 1540 1045, 1280 1045, 1080 1015 Z" fill="#397f8f"/>
