<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Relaxed lagoon background</title>
  <desc id="desc">A calm tropical lagoon with soft sky, distant islands, gentle sea, and sandy foreground.</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9edceb"/>
      <stop offset="45%" stop-color="#b8e9ee"/>
      <stop offset="100%" stop-color="#d5f2ef"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65c6d3"/>
      <stop offset="45%" stop-color="#47adc0"/>
      <stop offset="100%" stop-color="#338fa6"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c5"/>
      <stop offset="45%" stop-color="#ebd8ae"/>
      <stop offset="100%" stop-color="#e0c595"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.73" cy="0.17" r="0.22">
      <stop offset="0%" stop-color="#fff9d8" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#fff9d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#skyGrad)"/>
  <rect width="3840" height="2160" fill="url(#sun)"/>

